<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>車停哪裡</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
  <style>
    :root{--bg:#8fd3ff;--dot:#6dbcf2;--ink:#1b1b1f;--panel:#ffffff;--pink:#ff7fa8;--sun:#ffd23f;--mute:#4d5360;--dark:#1b1b1f;--cell:#f3f7fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    @media (prefers-color-scheme:dark){:root{--bg:#1d2340;--dot:#2b3363;--ink:#f4f1ff;--panel:#2b2f4a;--mute:#b9bcd6;--cell:#23273f}}
    *{box-sizing:border-box} html,body{margin:0}
    body{font-family:"Huninn",sans-serif;color:var(--ink);line-height:1.45;background-color:var(--bg);background-image:radial-gradient(var(--dot) 22%,transparent 24%);background-size:14px 14px}
    main{max-width:520px;margin:0 auto;padding:18px 12px 56px}
    .title{font-size:36px;margin:4px 4px 14px;font-weight:400;color:var(--sun);-webkit-text-stroke:2px var(--dark);paint-order:stroke fill;text-shadow:3px 3px 0 var(--dark);transform:rotate(-2deg);display:inline-block;letter-spacing:.04em}
    .box{background:var(--panel);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:14px}
    .bubble{position:relative;margin-bottom:26px}
    .bubble::after{content:"";position:absolute;left:34px;bottom:-20px;width:24px;height:24px;background:var(--panel);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:skewX(-20deg) rotate(45deg) translate(-4px,-6px);border-radius:0 0 6px 0}
    .bubble small{font-size:14px;color:var(--mute)}
    .bubble h2{font-size:26px;line-height:1.2;margin:2px 0 2px;font-weight:400;word-break:break-word}
    .bubble a{color:var(--ink);font-size:15px;text-underline-offset:3px}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .nav h3{margin:0;font-size:24px;font-weight:400}
    .nb{font:inherit;font-size:18px;width:42px;height:38px;border:3px solid var(--ink);border-radius:10px;background:var(--sun);color:var(--dark);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
    .today{font:inherit;font-size:14px;height:38px;padding:0 10px;border:3px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .wd{text-align:center;font-size:14px;padding:2px 0;color:var(--mute)}
    .wd:first-child,.wd:last-child{color:var(--pink)}
    .day{min-height:62px;padding:3px 2px;border:2px solid var(--ink);border-radius:8px;background:var(--cell);color:var(--ink);font:inherit;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}
    .day b{font-weight:400;font-size:13px;line-height:1.1}
    .day i{font-style:normal;font-size:11px;line-height:1.15;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .day.has{background:var(--sun);color:var(--dark)}
    .day.blank{visibility:hidden}
    .day.now b{background:var(--pink);color:var(--dark);border-radius:999px;padding:0 5px;border:2px solid var(--ink)}
    .day.sel{outline:4px solid var(--pink);outline-offset:1px;box-shadow:2px 2px 0 var(--ink)}
    .dayhead{margin:0 0 10px;font-size:20px;font-weight:400}
    .rec{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:2px dashed var(--ink)}
    .rec .info{flex:1;min-width:0;word-break:break-word;font-size:17px}
    .rec .info span{display:block;color:var(--mute);font-size:14px}
    .rec a{color:var(--mute);font-size:14px}
    .rec time{font-size:14px;color:var(--mute);flex:0 0 46px;padding-top:3px}
    .del{background:none;border:0;color:var(--pink);font:inherit;font-size:14px;cursor:pointer;padding:4px;font-weight:bold}
    .none{color:var(--mute);font-size:15px;margin:0 0 6px}
    .ask{margin:14px 0 8px;font-size:17px}
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{font:inherit;font-size:16px;padding:8px 13px;border:3px solid var(--ink);border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
    .chip.sel{background:var(--sun);color:var(--dark);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
    .chip.sel::before{content:"✔ "}
    input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;margin-top:10px;border:3px solid var(--ink);border-radius:12px;background:var(--panel);color:var(--ink)}
    input::placeholder{color:var(--mute);opacity:.8}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
    .gps{font:inherit;font-size:15px;padding:9px 12px;border:3px dashed var(--ink);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer}
    .gps.on{background:var(--sun);color:var(--dark);border-style:solid}
    .paw{position:relative;width:100px;height:100px;border-radius:50%;border:4px solid var(--ink);background:var(--pink);box-shadow:5px 5px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
    .paw svg{width:60px;height:60px;fill:var(--dark)}
    .paw:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
    .paw span{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--sun);color:var(--dark);border:3px solid var(--ink);border-radius:10px;padding:0 8px;font-size:14px;white-space:nowrap}
    .msg{margin:20px 0 0;font-size:14px;color:var(--mute);min-height:20px}
    .pop{position:fixed;left:50%;top:40%;z-index:9;pointer-events:none;font-size:64px;color:var(--sun);-webkit-text-stroke:3px var(--dark);paint-order:stroke fill;text-shadow:4px 4px 0 var(--dark);transform:translate(-50%,-50%) rotate(-8deg);animation:pop .9s ease-out forwards}
    @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-80%) scale(1) rotate(-8deg)}}
  </style>
</head>
<body>
<main id="root">
  <h1 class="title">今天車停哪？</h1>
  
  <section class="box bubble">
    <small id="nowLabel">還沒有紀錄</small>
    <h2 id="nowPlace">還沒有紀錄</h2>
    <span id="nowMap"></span>
  </section>

  <section class="box">
    <div class="nav">
      <button class="nb" id="prev">◀</button>
      <h3 id="mTitle"></h3>
      <button class="today" id="toToday">今天</button>
      <button class="nb" id="next">▶</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="box" style="margin-top:20px">
    <h3 class="dayhead" id="dayHead"></h3>
    <div id="dayRecs"></div>

    <div id="editor">
      <p class="ask">這天停在？</p>
      <div class="chips" id="chips"></div>
      <input id="place" type="text" placeholder="其他地點，自己打" autocomplete="off">
      <input id="note" type="text" placeholder="備註（選填）：柱子旁、已繳費" autocomplete="off">
      <div class="bar">
        <button type="button" class="gps" id="gps">加上定位</button>
        <button type="button" class="paw" id="paw">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <ellipse cx="12" cy="29" rx="6" ry="8.5" transform="rotate(-20 12 29)"/>
            <ellipse cx="25" cy="15" rx="6.5" ry="9"/>
            <ellipse cx="40" cy="15" rx="6.5" ry="9"/>
            <ellipse cx="53" cy="29" rx="6" ry="8.5" transform="rotate(20 53 29)"/>
            <path d="M32 29c-10 0-18 9-18 17 0 7 6 9 11 8 4-1 5-2 7-2s3 1 7 2c5 1 11-1 11-8 0-8-8-17-18-17z"/>
          </svg>
          <span>記下來</span>
        </button>
      </div>
    </div>
    <p class="msg" id="msg"></p>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// Setup Firebase & GitHub Pages compatibility
const LOCAL_KEY = "parking_records_local";
const hasFirebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config && __firebase_config !== '{}';
const appId = typeof __app_id !== 'undefined' ? __app_id : 'parking-app-realtime';
let db = null;
let auth = null;
let user = null;
let isFirebase = false;

if (hasFirebaseConfig) {
    try {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        isFirebase = true;
    } catch (e) {
        console.warn("Firebase 未設定或環境不支援，啟動本機模式", e);
    }
}

// Application State
const PRESETS = ["全聯旁邊", "舊小巷", "85度C", "洗衣店（燒臘店旁）", "紀醫師前面"];
let items = [];
let coords = null;
let sel = "";

// Helpers (defined before calling key)
const $ = id => document.getElementById(id);
const msg = t => { $("msg").textContent = t || ""; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function p2(n) { return ("0" + n).slice(-2); }
function key(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
const wk = ["日", "一", "二", "三", "四", "五", "六"];
function fmtDate(d) { return (d.getMonth() + 1) + "/" + d.getDate() + "（" + wk[d.getDay()] + "）"; }
function mapLink(c, p) { return "https://www.google.com/maps/search/?api=1&query=" + (c ? c.lat + "," + c.lng : encodeURIComponent(p)); }

const now = new Date();
let vy = now.getFullYear();
let vm = now.getMonth();
let cur = key(now);

// Firebase Collection Reference
function getRecordsRef() {
    return collection(db, 'artifacts', appId, 'public', 'data', 'shared_parking_records');
}

function chipList() {
    const l = PRESETS.slice();
    items.forEach(i => {
        if (l.indexOf(i.place) < 0 && l.length < PRESETS.length + 6) l.push(i.place);
    });
    return l;
}

function render() {
    // Sort items newest first
    items.sort((a, b) => b.t - a.t);
    const map = {};
    items.forEach(i => {
        const k = key(new Date(i.t));
        (map[k] = map[k] || []).push(i);
    });

    const first = new Date(vy, vm, 1);
    const dim = new Date(vy, vm + 1, 0).getDate();
    const todayK = key(new Date());

    $("mTitle").textContent = vy + " 年 " + (vm + 1) + " 月";
    
    let h = wk.map(w => `<div class="wd">${w}</div>`).join("");
    for (let b = 0; b < first.getDay(); b++) {
        h += '<button class="day blank" tabindex="-1" aria-hidden="true"></button>';
    }
    for (let d = 1; d <= dim; d++) {
        const k = vy + "-" + p2(vm + 1) + "-" + p2(d);
        const r = map[k];
        const c = "day" + (r ? " has" : "") + (k === todayK ? " now" : "") + (k === cur ? " sel" : "");
        h += `<button class="${c}" data-k="${k}"><b>${d}</b>${r ? '<i>' + esc(r[0].place) + '</i>' : ''}</button>`;
    }
    $("grid").innerHTML = h;

    const latest = items[0];
    if (latest) {
        const ld = new Date(latest.t);
        $("nowLabel").textContent = (key(ld) === todayK ? "今天" : fmtDate(ld)) + " " + p2(ld.getHours()) + ":" + p2(ld.getMinutes()) + "，車停在";
        $("nowPlace").textContent = latest.place;
        $("nowMap").innerHTML = `<a href="${mapLink(latest.c, latest.place)}" target="_blank" rel="noopener">在地圖上開啟</a>`;
    } else {
        $("nowLabel").textContent = "還沒有紀錄";
        $("nowPlace").textContent = "還沒有紀錄";
        $("nowMap").innerHTML = "";
    }

    const cp = cur.split("-");
    const cd = new Date(+cp[0], +cp[1] - 1, +cp[2]);
    $("dayHead").textContent = (cur === todayK ? "今天 " : "") + fmtDate(cd);

    const recs = map[cur] || [];
    $("dayRecs").innerHTML = recs.length ? recs.map(i => {
        const t = new Date(i.t);
        return `<div class="rec">
            <time>${p2(t.getHours())}:${p2(t.getMinutes())}</time>
            <div class="info">${esc(i.place)}${i.note ? '<span>' + esc(i.note) + '</span>' : ''}<a href="${mapLink(i.c, i.place)}" target="_blank" rel="noopener">地圖</a></div>
            <button class="del" data-t="${i.t}">刪除</button>
        </div>`;
    }).join("") : '<p class="none">這天沒有紀錄。</p>';

    $("chips").innerHTML = chipList().map(p => 
        `<button type="button" class="chip${p === sel ? ' sel' : ''}" data-p="${esc(p)}">${esc(p)}</button>`
    ).join("");
}

// Event Listeners
document.addEventListener("click", async function(e) {
    const t = e.target;
    
    // Calendar Day Clicks
    const g = t.closest && t.closest("[data-k]");
    if (g) {
        cur = g.getAttribute("data-k");
        msg("");
        render();
        return;
    }
    
    // Month Navigation
    if (t.id === "prev") {
        vm--; if (vm < 0) { vm = 11; vy--; }
        render(); return;
    }
    if (t.id === "next") {
        vm++; if (vm > 11) { vm = 0; vy++; }
        render(); return;
    }
    if (t.id === "toToday") {
        const n = new Date(); vy = n.getFullYear(); vm = n.getMonth(); cur = key(n);
        render(); return;
    }
    
    // Preset Chip Click
    const p = t.getAttribute && t.getAttribute("data-p");
    if (p) {
        sel = (sel === p) ? "" : p;
        $("place").value = "";
        msg("");
        render();
        return;
    }
    
    // Delete Record
    const dt = t.getAttribute && t.getAttribute("data-t");
    if (dt) {
        if (isFirebase) {
            if (!user) {
                msg("請等待連線完成後再操作。");
                return;
            }
            msg("刪除中...");
            try {
                await deleteDoc(doc(getRecordsRef(), dt));
                msg("已刪除紀錄。");
            } catch (err) {
                msg("刪除失敗：" + err.message);
            }
        } else {
            items = items.filter(i => String(i.t) !== dt);
            try { localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); } catch(e){}
            msg("已刪除紀錄。");
            render();
        }
        return;
    }
    
    // GPS Click
    if (t.id === "gps") {
        if (coords) {
            coords = null; t.classList.remove("on"); t.textContent = "加上定位"; msg(""); return;
        }
        if (!navigator.geolocation) {
            msg("此裝置不支援定位功能。"); return;
        }
        msg("定位中…");
        navigator.geolocation.getCurrentPosition(pos => {
            coords = { lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5) };
            t.classList.add("on"); t.textContent = "已定位（再點取消）"; msg("GPS 定位成功！");
        }, () => {
            msg("未能取得定位權限。");
        }, { enableHighAccuracy: true, timeout: 10000 });
        return;
    }
    
    // Save Record (Paw Click)
    const paw = t.closest && t.closest("#paw");
    if (paw) {
        if (isFirebase && !user) {
            msg("請等待連線完成後再儲存。");
            return;
        }
        
        const place = $("place").value.trim() || sel;
        if (!place) { msg("請先選擇或輸入停車地點。"); return; }
        
        const n2 = new Date();
        const cp = cur.split("-");
        const tt = (cur === key(n2)) ? n2.getTime() : new Date(+cp[0], +cp[1] - 1, +cp[2], n2.getHours(), n2.getMinutes(), n2.getSeconds()).getTime();
        
        const newRecord = { t: tt, place: place, note: $("note").value.trim(), c: coords };
        
        const resetFormAndPop = () => {
            coords = null; sel = "";
            const gpsBtn = $("gps");
            if (gpsBtn) { gpsBtn.classList.remove("on"); gpsBtn.textContent = "加上定位"; }

            const d = document.createElement("div");
            d.className = "pop";
            d.textContent = "啪！";
            document.body.appendChild(d);
            setTimeout(() => d.remove(), 900);

            $("place").value = "";
            $("note").value = "";
        };

        msg("儲存中...");
        if (isFirebase) {
            try {
                await setDoc(doc(getRecordsRef(), tt.toString()), newRecord);
                resetFormAndPop();
                msg("記好了！(已同步至雲端)");
            } catch (err) {
                msg("儲存失敗：" + err.message);
            }
        } else {
            items.unshift(newRecord);
            try { localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); } catch(e){}
            resetFormAndPop();
            render();
            msg("記好了！");
        }
    }
});

// Clear selection if typing custom place
$("place").addEventListener("input", function() {
    if (this.value) { sel = ""; render(); }
});

// Init Authentication and Realtime Sync
async function initApp() {
    render(); // Initial empty render
    
    if (isFirebase) {
        msg("連線至即時資料庫...");
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            user = auth.currentUser;
            
            if (user) {
                msg("已連線！讀取資料中...");
                onSnapshot(getRecordsRef(), (snapshot) => {
                    items = [];
                    snapshot.forEach(doc => {
                        items.push(doc.data());
                    });
                    render();
                    if (items.length > 0) {
                        msg("資料已同步！");
                        setTimeout(() => { if($("msg").textContent === "資料已同步！") msg(""); }, 3000);
                    } else {
                        msg("沒有過往紀錄，開始記錄吧！");
                    }
                }, (error) => {
                    console.error("Firestore sync error:", error);
                    msg("同步資料時發生錯誤。");
                });
            }
        } catch (error) {
            console.error("Auth error:", error);
            msg("連線失敗，請重新整理頁面。");
        }
    } else {
        // Fallback for GitHub Pages standalone deployment
        try {
            items = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
        } catch(e) {
            items = [];
        }
        render();
        msg("已就緒！點開即可直接記錄。");
        setTimeout(() => { if($("msg").textContent === "已就緒！點開即可直接記錄。") msg(""); }, 2500);
    }
}

// Start
initApp();
</script>
</body>
</html>
