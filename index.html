<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>車停哪裡</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
  <style>
    :root {
      --bg: #8fd3ff;
      --dot: #6dbcf2;
      --ink: #1b1b1f;
      --panel: #ffffff;
      --pink: #ff7fa8;
      --sun: #ffd23f;
      --mute: #4d5360;
      --dark: #1b1b1f;
      --cell: #f3f7fb;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d2340;
        --dot: #2b3363;
        --ink: #f4f1ff;
        --panel: #2b2f4a;
        --mute: #b9bcd6;
        --cell: #23273f;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Huninn", "Chiron GoRound TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      line-height: 1.45;
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 22%, transparent 24%);
      background-size: 14px 14px;
    }
    main { max-width: 520px; margin: 0 auto; padding: 18px 12px 56px; }
    .title {
      font-size: 34px;
      margin: 4px 4px 14px;
      font-weight: 400;
      color: var(--sun);
      -webkit-text-stroke: 2px var(--dark);
      paint-order: stroke fill;
      text-shadow: 3px 3px 0 var(--dark);
      transform: rotate(-2deg);
      display: inline-block;
      letter-spacing: .04em;
    }
    .box {
      background: var(--panel);
      border: 3px solid var(--ink);
      border-radius: 16px;
      box-shadow: 5px 5px 0 var(--ink);
      padding: 14px;
    }
    .bubble { position: relative; margin-bottom: 26px; }
    .bubble::after {
      content: "";
      position: absolute;
      left: 34px;
      bottom: -20px;
      width: 24px;
      height: 24px;
      background: var(--panel);
      border-right: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      transform: skewX(-20deg) rotate(45deg) translate(-4px, -6px);
      border-radius: 0 0 6px 0;
    }
    .bubble small { font-size: 14px; color: var(--mute); display: block; }
    .bubble h2 { font-size: 26px; line-height: 1.25; margin: 4px 0; font-weight: bold; word-break: break-word; }
    .bubble a { color: var(--ink); font-size: 15px; text-underline-offset: 3px; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .nav h3 { margin: 0; font-size: 22px; font-weight: bold; }
    .nb {
      font: inherit; font-size: 18px; width: 42px; height: 38px;
      border: 3px solid var(--ink); border-radius: 10px;
      background: var(--sun); color: var(--dark); cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .today {
      font: inherit; font-size: 14px; height: 38px; padding: 0 12px;
      border: 3px solid var(--ink); border-radius: 10px;
      background: var(--panel); color: var(--ink); cursor: pointer;
    }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .wd { text-align: center; font-size: 14px; padding: 2px 0; color: var(--mute); }
    .wd:first-child, .wd:last-child { color: var(--pink); }
    .day {
      min-height: 62px; padding: 3px 2px; border: 2px solid var(--ink);
      border-radius: 8px; background: var(--cell); color: var(--ink);
      font: inherit; text-align: center; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      overflow: hidden;
    }
    .day b { font-weight: normal; font-size: 13px; line-height: 1.1; }
    .day i {
      font-style: normal; font-size: 11px; line-height: 1.15;
      word-break: break-all; display: -webkit-box;
      -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .day.has { background: var(--sun); color: var(--dark); }
    .day.blank { visibility: hidden; pointer-events: none; }
    .day.now b { background: var(--pink); color: var(--dark); border-radius: 999px; padding: 0 5px; border: 2px solid var(--ink); }
    .day.sel { outline: 4px solid var(--pink); outline-offset: 1px; box-shadow: 2px 2px 0 var(--ink); }
    .dayhead { margin: 0 0 10px; font-size: 20px; font-weight: bold; }
    .rec { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 2px dashed var(--ink); }
    .rec .info { flex: 1; min-width: 0; word-break: break-word; font-size: 16px; }
    .rec .info span { display: block; color: var(--mute); font-size: 13px; }
    .rec a { color: var(--mute); font-size: 13px; margin-left: 6px; }
    .rec time { font-size: 14px; color: var(--mute); flex: 0 0 46px; padding-top: 2px; }
    .del { background: none; border: 0; color: var(--pink); font: inherit; font-size: 14px; cursor: pointer; padding: 4px; font-weight: bold; }
    .none { color: var(--mute); font-size: 15px; margin: 0 0 6px; }
    .ask { margin: 14px 0 8px; font-size: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font: inherit; font-size: 15px; padding: 7px 12px;
      border: 3px solid var(--ink); border-radius: 14px;
      background: var(--panel); color: var(--ink); cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .chip.sel { background: var(--sun); color: var(--dark); transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
    .chip.sel::before { content: "✔ "; }
    input[type=text] {
      width: 100%; font: inherit; font-size: 15px; padding: 10px 12px;
      margin-top: 10px; border: 3px solid var(--ink); border-radius: 12px;
      background: var(--panel); color: var(--ink);
    }
    input::placeholder { color: var(--mute); opacity: .8; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
    .gps {
      font: inherit; font-size: 14px; padding: 9px 12px;
      border: 3px dashed var(--ink); border-radius: 12px;
      background: transparent; color: var(--ink); cursor: pointer;
    }
    .gps.on { background: var(--sun); color: var(--dark); border-style: solid; }
    .paw {
      position: relative; width: 92px; height: 92px; border-radius: 50%;
      border: 4px solid var(--ink); background: var(--pink);
      box-shadow: 4px 4px 0 var(--ink); cursor: pointer;
      display: grid; place-items: center; padding: 0;
    }
    .paw svg { width: 56px; height: 56px; fill: var(--dark); }
    .paw:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    .paw span {
      position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%) rotate(-3deg);
      background: var(--sun); color: var(--dark); border: 3px solid var(--ink);
      border-radius: 10px; padding: 0 8px; font-size: 13px; white-space: nowrap;
    }
    .msg { margin: 16px 0 0; font-size: 14px; color: var(--mute); min-height: 20px; }
    .pop {
      position: fixed; left: 50%; top: 40%; z-index: 99; pointer-events: none;
      font-size: 56px; color: var(--sun); -webkit-text-stroke: 3px var(--dark);
      paint-order: stroke fill; text-shadow: 4px 4px 0 var(--dark);
      transform: translate(-50%, -50%) rotate(-8deg); animation: pop .9s ease-out forwards;
    }
    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); }
      25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(-8deg); }
      100% { opacity: 0; transform: translate(-50%, -80%) scale(1) rotate(-8deg); }
    }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  </style>
</head>
<body>
<main id="root">
  <h1 class="title">今天車停哪？</h1>
  
  <section class="box bubble">
    <small id="nowLabel">還沒有紀錄</small>
    <h2 id="nowPlace">還沒有紀錄</h2>
    <span id="nowMap"></span>
  </section>

  <section class="box">
    <div class="nav">
      <button class="nb" id="prev" aria-label="上個月">◀</button>
      <h3 id="mTitle"></h3>
      <button class="today" id="toToday">今天</button>
      <button class="nb" id="next" aria-label="下個月">▶</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="box" style="margin-top:20px">
    <h3 class="dayhead" id="dayHead"></h3>
    <div id="dayRecs"></div>

    <div id="editor">
      <p class="ask">這天停在？</p>
      <div class="chips" id="chips"></div>
      <input id="place" type="text" placeholder="其他地點，自己打" autocomplete="off">
      <input id="note" type="text" placeholder="備註（選填）：柱子旁、已繳費" autocomplete="off">
      <div class="bar">
        <button type="button" class="gps" id="gps">加上定位</button>
        <button type="button" class="paw" id="paw" aria-label="記下來">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <ellipse cx="12" cy="29" rx="6" ry="8.5" transform="rotate(-20 12 29)"/>
            <ellipse cx="25" cy="15" rx="6.5" ry="9"/>
            <ellipse cx="40" cy="15" rx="6.5" ry="9"/>
            <ellipse cx="53" cy="29" rx="6" ry="8.5" transform="rotate(20 53 29)"/>
            <path d="M32 29c-10 0-18 9-18 17 0 7 6 9 11 8 4-1 5-2 7-2s3 1 7 2c5 1 11-1 11-8 0-8-8-17-18-17z"/>
          </svg>
          <span>記下來</span>
        </button>
      </div>
    </div>
    <p class="msg" id="msg"></p>
  </section>
</main>

<script>
(function() {
  const KEY = "parking-log-local-v1";

  // 前台顯示的按鈕名稱
  const PRESETS = [
    "市場全聯",
    "舊小象旁邊",
    "85度C/燒臘店對面",
    "夾娃娃機/洗衣店旁",
    "紀醫師前面"
  ];

  // 後台專屬地址對應表（不顯示在前台，僅供地圖定位導航）
  const ADDRESS_MAP = {
    "市場全聯": "基隆市七堵區南興路106號",
    "舊小象旁邊": "基隆市七堵區崇信街13-7號",
    "85度C/燒臘店對面": "基隆市七堵區明德一路212號",
    "夾娃娃機/洗衣店旁": "基隆市七堵區自治北街10號",
    "紀醫師前面": "基隆市七堵區開元路85號",
    // 相容歷史舊紀錄
    "全聯旁邊": "基隆市七堵區南興路106號",
    "舊小巷": "基隆市七堵區崇信街13-7號",
    "85度C": "基隆市七堵區明德一路212號",
    "洗衣店（燒臘店旁）": "基隆市七堵區自治北街10號"
  };

  let items = [];
  let coords = null;
  let sel = "";

  function p2(n) { return ("0" + n).slice(-2); }
  function key(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
  const wk = ["日", "一", "二", "三", "四", "五", "六"];
  function fmtDate(d) { return (d.getMonth() + 1) + "/" + d.getDate() + "（" + wk[d.getDay()] + "）"; }

  // 點擊地圖時：有 GPS 優先用 GPS；若無 GPS 則抓取後台地址導航
  function mapLink(c, p) {
    if (c) {
      return "https://www.google.com/maps/search/?api=1&query=" + c.lat + "," + c.lng;
    }
    const target = ADDRESS_MAP[p] || p;
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(target);
  }

  const now = new Date();
  let vy = now.getFullYear();
  let vm = now.getMonth();
  let cur = key(now);

  const $ = id => document.getElementById(id);
  const msg = t => { $("msg").textContent = t || ""; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function loadData() {
    try {
      items = JSON.parse(localStorage.getItem(KEY) || "[]");
    } catch(e) {
      items = [];
    }
  }

  function saveData(okText) {
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
    } catch(e) {}
    if (okText) msg(okText);
    render();
  }

  function chipList() {
    const list = PRESETS.slice();
    items.forEach(i => {
      if (list.indexOf(i.place) < 0 && list.length < PRESETS.length + 6) list.push(i.place);
    });
    return list;
  }

  function render() {
    items.sort((a, b) => b.t - a.t);
    const map = {};
    items.forEach(i => {
      const k = key(new Date(i.t));
      (map[k] = map[k] || []).push(i);
    });

    const first = new Date(vy, vm, 1);
    const dim = new Date(vy, vm + 1, 0).getDate();
    const todayK = key(new Date());

    $("mTitle").textContent = vy + " 年 " + (vm + 1) + " 月";

    let h = wk.map(w => `<div class="wd">${w}</div>`).join("");
    for (let b = 0; b < first.getDay(); b++) {
      h += '<button class="day blank" tabindex="-1" aria-hidden="true"></button>';
    }
    for (let d = 1; d <= dim; d++) {
      const k = vy +
